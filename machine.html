<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Useless Machine | Learning HTML</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="app-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-nav"></div>
  <main>
    <h1>The Useless Machine</h1>
    <p>How many times can you turn it on before it turns itself off? You have 10 seconds.</p>
    <section class="machine" aria-labelledby="machine-title">
      <h2 id="machine-title">Switch challenge</h2>
      <p class="game-score">Score: <output id="score">0</output></p>
      <button id="power-button" type="button">Start game</button>
      <p id="machine-message" aria-live="polite">Press start when you are ready.</p>
      <p id="time-left">10 seconds</p>
    </section>
  </main>
  <script src="nav.js"></script>
  <script src="machine.js"></script>
</body>
</html>
