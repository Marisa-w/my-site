<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning HTML</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-nav"></div>
  <main>
    <h1>Learning HTML</h1>
    <img src="1234.jpg" alt="Learning HTML homepage hero image">
<p>A website built while learning HTML, CSS and JavaScript.</p>

    <section class="gallery" aria-labelledby="gallery-title">
      <h2 id="gallery-title">Images from my collection</h2>
      <p>A few colors and forms that caught my eye.</p>
      <div class="gallery-grid">
        <figure>
          <img src="flower-stalks.jpg" alt="Tall purple flower spikes against a soft green background">
          <figcaption>Flower spikes in soft afternoon light</figcaption>
        </figure>
        <figure>
          <img src="gold-violet-abstract.jpg" alt="Flowing abstract shapes in gold, cream and violet">
          <figcaption>Flowing gold and violet shapes</figcaption>
        </figure>
        <figure>
          <img src="purple-flower.jpg" alt="A purple flower with raindrops against a dark green background">
          <figcaption>A flower after the rain</figcaption>
        </figure>
        <figure>
          <img src="pastel-clouds.png" alt="Soft blue and pink cloud-like forms">
          <figcaption>Blue and pink cloud forms</figcaption>
        </figure>
      </div>
      <p class="image-credit">Images downloaded from Pixnio. Please add the individual image-page links or creator names if your course requires full attribution.</p>
    </section>
  </main>

  

  <script src="nav.js"></script>
</body>
</html>
